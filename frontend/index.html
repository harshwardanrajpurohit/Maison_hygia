<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maison Hygia</title>
    <meta name="description" content="AI-powered Ayurvedic ritual intelligence.">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar (Hidden on mobile by default) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Maison Hygia</h2>
                <button id="btn-new-chat" class="new-chat-btn" title="New Ritual">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </div>
            
            <div class="sidebar-content">
                <div class="recent-chats-label">Try saying...</div>
                <div class="suggested-prompts">
                    <button class="suggestion-btn" data-prompt="I need a simple evening routine for dry skin.">🌙 Evening Routine</button>
                    <button class="suggestion-btn" data-prompt="Meri skin dry hai, kuch simple sa batao.">💧 Dry Skin (Hindi)</button>
                    <button class="suggestion-btn" data-prompt="I want a morning glow routine, nothing complicated.">✨ Morning Glow</button>
                    <button class="suggestion-btn" data-prompt="Skin dry hai yaar, bas 2 products suggest karo.">🧴 Quick Fix (Hinglish)</button>
                    <button class="suggestion-btn" data-prompt="mala simple night routine pahije.">🌿 Night Routine (Marathi)</button>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="avatar">U</div>
                    <span>User Mode</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <!-- Mobile Header (Visible only on small screens) -->
            <header class="mobile-header">
                <button id="btn-toggle-sidebar" class="icon-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1>Maison Hygia</h1>
            </header>

            <!-- Chat History Feed -->
            <div id="chat-feed" class="chat-feed">
                <!-- Welcome Message dynamically inserted here by JS -->
            </div>

            <!-- Input Area -->
            <div class="input-container">
                <!-- Image Preview Area -->
                <div id="image-preview" class="image-preview-bar hidden">
                    <div class="preview-card">
                        <img id="preview-img" alt="Attached" />
                        <button id="btn-remove-image" class="preview-remove" title="Remove image">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>

                <div class="input-box">
                    <input type="file" id="image-upload" accept="image/jpeg,image/png,image/webp" style="display: none;">
                    <button id="btn-camera" class="icon-btn camera-btn" title="Take a photo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </button>
                    <button id="btn-attach" class="icon-btn attach-btn" title="Attach an image">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                    </button>
                    
                    <textarea id="chat-input" placeholder="Type in any language — English, Hindi, Hinglish, Marathi..." rows="1"></textarea>
                    
                    <button id="btn-send" class="icon-btn send-btn" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="input-footer">
                    AI can make mistakes. Consider verifying important wellness advice.
                </div>
            </div>
        </main>
    </div>

    <!-- Live Camera Modal -->
    <div id="camera-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Take a Photo</h3>
                <button id="btn-close-camera" class="icon-btn">✕</button>
            </div>
            <div class="video-container">
                <video id="camera-video" autoplay playsinline></video>
                <canvas id="camera-canvas" style="display: none;"></canvas>
            </div>
            <div class="modal-footer">
                <button id="btn-capture-photo" class="capture-btn">
                    <div class="capture-inner"></div>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
